">
  <!-- Notices will be inserted here by JavaScript -->
  <div id="noticesContent"></div>
</div>

<script>
function loadNotices() {
  firebase.firestore().collection('notices').onSnapshot(snap => {
    const noticesDiv = document.getElementById('noticesContent');
    noticesDiv.innerHTML = ''; // Clear previous notices
    const notices = [];
    snap.forEach(doc => {
      const data = doc.data();
      notices.push(data.message);
    });
    if (notices.length === 0) {
      noticesDiv.innerHTML = '<em>No notices at the moment.</em>';
    } else {
      // Display notices as a list
      notices.forEach(msg => {
        const p = document.createElement('p');
        p.style.margin = '8px 0'; // spacing between notices
        p.innerText = msg;
        noticesDiv.appendChild(p);
      });
    }
  });
}

// Call on page load
window.onload = loadNotices;
</script>

<script>
  // Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyBGeMNLIzAlTfEHghPGPgo24gQIgktTlrE",

  appId: "1:687490679953:web:a3d293c0acf0a3cd322b30"
};
  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const storage = firebase.storage();

  // DOM elements
  const dataSection = document.getElementById('dataSection');
  const imagesContainer = document.getElementById('imagesContainer');
  const uploadSection = document.getElementById('uploadSection');
  const uploadBtn = document.getElementById('uploadBtn');
  const nameInput = document.getElementById('nameInput');
  const imageInput = document.getElementById('imageInput');
  const logoutBtn = document.getElementById('logoutBtn');

  let currentUser = null;
  let role = null;

  // Check login on load
  window.onload = () => {
    checkLogin();
  };

  function checkLogin() {
    const email = localStorage.getItem('userEmail');
    role = localStorage.getItem('role');

    if (!role || !email) {
      // Not logged in, redirect to login
      window.location.href='index.html';
      return;
    }
    // Logged in
    currentUser = email;

    // Show logout button
    logoutBtn.style.display='block';

    // Show data section
    dataSection.style.display='block';

    // Show/hide upload section based on role
    if (role === 'admin') {
      document.getElementById('uploadSection').style.display='block';
    } else {
      document.getElementById('uploadSection').style.display='none';
    }

    loadData();
  }

  // Load data from Firestore
  async function loadData() {
    imagesContainer.innerHTML = '';
    const q = firebase.firestore().collection('exam').orderBy('timestamp', 'desc');
    const querySnapshot = await q.get();

    querySnapshot.forEach((doc) => {
      const data = doc.data();
      const div = document.createElement('div');
      div.className = 'item';

 // Compose innerHTML for item
div.innerHTML = `
  <div class="item">
    <p style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
      ${data.name}
    </p>
    <img src="${data.imageUrl}" alt="${data.name}" />
  </div>
  ${role === 'admin' ? `
  <div class="admin-buttons">
      <button onclick="handleEdit('${doc.id}', '${data.name}', '${data.imageUrl}')">Edit</button>
      <button onclick="handleDelete('${doc.id}')">Delete</button>
  </div>
  ` : ''}
`;
      // Append to container
      imagesContainer.appendChild(div);
    });
  }
  //download function
  function downloadImage(url, name) {
  fetch(url)
    .then(resp => {
      if (!resp.ok) throw new Error('Network response was not ok');
      return resp.blob();
    })
    .then(blob => {
      const urlBlob = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = urlBlob;
      a.download = name || 'download';
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(urlBlob);
    })
    .catch((err) => {
      alert('Failed to download image: ' + err.message);
    });
}
  // Logout
  document.getElementById('logoutBtn').onclick = () => {
    localStorage.removeItem('role');
    localStorage.removeItem('userEmail');
    auth.signOut();
    window.location.href='index.html';
  };

  // Upload handler (admin only)
  document.getElementById('uploadBtn').onclick = async () => {
    if (role !== 'admin') {
      alert('Only admin can upload.');
      return;
    }
    const name = nameInput.value.trim();
    const file = imageInput.files[0];
    if (!name || !file) {
      alert('Please enter a name and select an image.');
      return;
    }
    try {
      const storageRef = storage.ref('images/' + Date.now() + '_' + file.name);
      await storageRef.put(file);
      const url = await storageRef.getDownloadURL();

      await firebase.firestore().collection('exam').add({
        name: name,
        imageUrl: url,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      alert('Uploaded successfully!');
      nameInput.value = '';
      imageInput.value = '';
      loadData();
    } catch (err) {
      alert('Error uploading: ' + err.message);
    }
  };

  // Handle delete
  async function handleDelete(docId) {
    if (role !== 'admin') {
      alert('Only admin can delete.');
      return;
    }
    if (confirm('Are you sure you want to delete?')) {
      try {
        await firebase.firestore().collection('exam').doc(docId).delete();
        loadData();
      } catch (err) {
        alert('Error deleting: ' + err.message);
      }
    }
  }
//edit function
async function handleEdit(docId, currentName, currentImageUrl) {
  if (role !== 'admin') {
    alert('Only admin can edit.');
    return;
  }

  const newName = prompt('Enter new name:', currentName);
  if (!newName || newName.trim() === '') {
    return; // Cancel if no name provided
  }

  const newImageUrl = prompt('Enter new image URL:', currentImageUrl);
  if (!newImageUrl || newImageUrl.trim() === '') {
    return; // Cancel if no image URL provided
  }

  try {
    await firebase.firestore().collection('exam').doc(docId).update({
      name: newName.trim(),
      imageUrl: newImageUrl.trim()
    });
    loadData(); // Refresh data to reflect changes
  } catch (err) {
    alert('Error updating: ' + err.message);
  }
}
