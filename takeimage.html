<h2>Notices</h2>
<div id="noticesContainer" style="
  border: 2px solid #4CAF50; /* border color */

  background-color: #e8f5e9; /* soft background color */
  padding: 15px; /* inner padding */

  font-family: Arial, sans-serif; /* font style */
  font-size: 16px; /* font size */

  min-height: 50px; /* minimum height for consistency */
">
  <!-- Notices will be inserted here by JavaScript -->
  <div id="noticesContent"></div>
</div>
<script>
function loadNotices() {
  firebase.firestore().collection('notices').onSnapshot(snap => {
    const noticesDiv = document.getElementById('noticesContent');
    noticesDiv.innerHTML = ''; // Clear previous notices
    const notices = [];
    snap.forEach(doc => {
      const data = doc.data();
      notices.push(data.message);
    });
    if (notices.length === 0) {
      noticesDiv.innerHTML = '<em>No notices at the moment.</em>';
    } else {
      notices.forEach(msg => {
        const p = document.createElement('p');
        p.style.margin = '8px 0';
        p.innerText = msg;
        noticesDiv.appendChild(p);
      });
    }
  });
}
window.onload = loadNotices;
</script>

  // Load duty status function
  function loadDutyStatus() {
    firebase.firestore().collection('formed_groups').get()
      .then(snap => {
        const groups = [];
        snap.forEach(doc => {
          const data = doc.data();
          const groupName = data.name || doc.id;
          groups.push(groupName);
        });
        if (groups.length===0) {
          document.getElementById('dutyStatus').innerText="No group formed";
          return;
        }
        const today = new Date();
        const start = new Date(today.getFullYear(), 0, 0);
        const diff = today - start + ((start.getTimezoneOffset() - today.getTimezoneOffset()) * 60 * 1000);
        const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
        const index = dayOfYear % groups.length;
        const dutyTeam = groups[index];
        document.getElementById('dutyStatus').innerText = `Today's Duty: ${dutyTeam}`;
      })
      .catch(e => {
        console.error('Error loading groups for duty status:', e);
        document.getElementById('dutyStatus').innerText = "Error loading duty status";
      });
  }
